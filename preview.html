<!doctype html><html><head><meta charset="utf-8"><title>Style preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>body{margin:0;background:#888}#prev{display:grid;grid-template-columns:640px 640px}#prev .w{width:640px;height:360px;overflow:hidden;position:relative}#prev .w .pg{transform:scale(.5);transform-origin:0 0;position:absolute}</style>
</head><body><div id="root" style="display:none"></div><div id="printroot"></div><div id="toast"></div><div id="modal"></div><div id="prev"></div>
<script src="lib.js"></script><script src="app.js"></script>
<script>setTimeout(async()=>{let p=S.projects.find(x=>x.demo)||S.projects[0];if(!p){p=await demoProject()}const sid=new URLSearchParams(location.search).get('s')||'poster';const d=basicDoc(p,sid);document.getElementById('prev').innerHTML=renderPages(p,d).map(h=>'<div class="w">'+h+'</div>').join('');document.getElementById('root').remove()},3500)</script>
</body></html>
